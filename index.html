<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manual PetBel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{box-sizing:border-box;--brand:#d90a68;--brand-deep:#a10650;--brand-ink:#ffffff;--accent:#fff701;--font-display:'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;--font-body:'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;--radius:16px;
--bg:#f7f5f2;--surface:#fff;--soft:#faf8f6;--text:#161214;--muted:#625a5f;--line:#e6e1e3;--bar:#0b0b0b;--pk-tint:#fde8f1;--pk-ink:#b80a57;--warn-bg:#fff8c4;--warn-line:#cfb900;--ok:#12874b;--ok-tint:#e4f4ea;--bad-tint:#fde8f1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d0a0b;--surface:#171214;--soft:#120e10;--text:#f5f0f2;--muted:#b9adb3;--line:#2e2529;--pk-tint:#3a0f25;--pk-ink:#ff6aa9;--warn-bg:#2a2606;--warn-line:#8f8300;--ok:#4cc88a;--ok-tint:#10281b;--bad-tint:#3a0f25}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d0a0b;--surface:#171214;--soft:#120e10;--text:#f5f0f2;--muted:#b9adb3;--line:#2e2529;--pk-tint:#3a0f25;--pk-ink:#ff6aa9;--warn-bg:#2a2606;--warn-line:#8f8300;--ok:#4cc88a;--ok-tint:#10281b;--bad-tint:#3a0f25}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:84px;scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,a,summary,select{touch-action:manipulation}
input,select,textarea{font-size:16px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:30}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.2;letter-spacing:-.015em;margin:0 0 .5em;font-weight:800;overflow-wrap:break-word}
h1{font-size:clamp(28px,4.6vw,40px)}h2{font-size:clamp(21px,3vw,26px)}h3{font-size:18px;font-weight:700}
p{margin:0 0 .9em}a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.ic{display:inline-flex;flex:none;line-height:0}
.hide-m{display:initial}
/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:#fff;display:flex;align-items:center;gap:6px;padding:0 12px;height:64px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:17px;letter-spacing:-.01em;margin-right:6px}
.brand img{width:36px;height:36px;display:block}
.navl{display:flex;gap:2px;margin-right:auto}.navl a{padding:8px 12px;border-radius:10px;color:#d9d0d4;font-weight:600;font-size:14.5px;text-decoration:none}
.navl a:hover,.navl a[aria-current]{background:rgba(255,255,255,.1);color:#fff}
.sbar{flex:0 1 330px;min-width:0;display:flex;align-items:center;gap:10px;height:42px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:#d9d0d4;padding:0 12px;cursor:pointer;text-align:left}
.sbar:hover{background:rgba(255,255,255,.16)}.sbar span{flex:1;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:600 12px var(--font-body);border:1px solid currentColor;border-radius:6px;padding:0 6px;opacity:.7}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:transparent;border:0;color:#fff;cursor:pointer}.iconbtn:hover{background:rgba(255,255,255,.12)}
/* menu lateral */
.shell{display:block}
.side{position:fixed;z-index:25;top:0;bottom:0;left:0;width:min(88vw,320px);background:var(--surface);padding:78px 12px 110px;overflow:auto;transform:translateX(-102%);transition:transform .25s;border-right:1px solid var(--line)}
body.menu .side{transform:none}
.scrim{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:24;background:rgba(0,0,0,.5)}body.menu .scrim{display:block}
.side .sh{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:18px 10px 6px}
.side a,.side summary{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-decoration:none;font-size:14.5px;line-height:1.35;border-left:3px solid transparent;cursor:pointer;list-style:none}
.side summary::-webkit-details-marker{display:none}.side summary{font-weight:700}
.side a:hover,.side summary:hover{background:var(--soft)}
.side a.cur{background:var(--pk-tint);color:var(--pk-ink);font-weight:700;border-left-color:var(--brand)}
.side details a{margin-left:14px;padding-left:12px;border-left:1px solid var(--line);border-radius:0 10px 10px 0}
.side details a.cur{border-left:3px solid var(--brand)}
.side .cd{font-size:11.5px;font-weight:800;color:var(--muted);min-width:42px;letter-spacing:.03em}
.side .ok::after{content:"✓";margin-left:auto;color:var(--ok);font-weight:800}
main{max-width:980px;margin:0 auto;padding:22px 16px 130px;min-width:0}
@media(min-width:980px){.shell{display:grid;grid-template-columns:288px minmax(0,1fr)}.side{position:sticky;top:64px;height:calc(100vh - 64px);transform:none;padding:8px 12px 24px}.scrim,.tabbar{display:none!important}main{padding:36px 36px 80px}.iconbtn#menu{display:none}}
@media(max-width:979px){.hide-m{display:none!important}.sbar{flex:none;width:44px;padding:0;justify-content:center;margin-left:auto}.brand{margin-right:auto}}
body.foco .side,body.foco .top,body.foco .foot{display:none}body.foco .shell{display:block}body.foco main{max-width:780px}
.focob{display:none;position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:40;background:var(--bar);color:#fff;border:0;border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer;font-weight:700}body.foco .focob{display:inline-flex;align-items:center;gap:8px}
/* botões e chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.btn:hover{border-color:var(--brand)}.btn.pk{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}.btn.pk:hover{background:var(--brand-deep)}.btn.sm{min-height:34px;padding:2px 12px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}.chip{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13.5px;color:var(--muted);text-decoration:none}
a.chip:hover{border-color:var(--brand);color:var(--pk-ink)}
.code{display:inline-block;background:var(--pk-tint);color:var(--pk-ink);border-radius:8px;padding:3px 10px;font:800 13px var(--font-display);letter-spacing:.05em}
.crumb{font-size:13.5px;color:var(--muted);margin:0 0 14px}.crumb a{text-decoration:none}.crumb a:hover{color:var(--pk-ink)}
.lead{font-size:17.5px;color:var(--muted)}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--brand);transition:width .3s}
/* home: hero */
.hero{position:relative;overflow:hidden;border-radius:22px;background:#0b0b0b;color:#fff;padding:30px 22px;display:grid;gap:26px;isolation:isolate}
.hero::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:-1;background:radial-gradient(620px 320px at 95% -10%,rgba(217,10,104,.6),transparent 70%),radial-gradient(460px 280px at -5% 115%,rgba(255,247,1,.12),transparent 70%)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}.eyebrow::before{content:"";width:22px;height:2px;background:var(--accent)}
.hero h1{color:#fff;font-size:clamp(30px,5.8vw,52px);margin:14px 0 12px;line-height:1.08}
.hero .sub{color:#d8cfd3;font-size:17px;max-width:34em;margin:0 0 24px}
.hsearch{display:flex;align-items:center;gap:12px;width:100%;max-width:560px;height:56px;border-radius:14px;background:#fff;color:#4f464b;border:0;padding:0 16px;cursor:pointer;text-align:left;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.hsearch .t{flex:1;font-size:16px}.hsearch:hover{box-shadow:0 12px 32px rgba(217,10,104,.45)}
.hchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hchips button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:600;cursor:pointer;min-height:40px}.hchips button:hover{background:#fff;color:#111}
.stats{display:flex;flex-wrap:wrap;gap:12px 30px;margin-top:26px;padding-top:20px;border-top:1px solid rgba(255,255,255,.16)}
.stats b{display:block;font:800 26px/1.1 var(--font-display);color:#fff}.stats span{font-size:13px;color:#bdb3b8}
.hbadge{display:none}
@media(min-width:860px){.hero{grid-template-columns:1fr 230px;padding:50px 46px;align-items:center}.hbadge{display:block}.hbadge img{display:block;width:216px;height:216px;filter:drop-shadow(0 20px 40px rgba(217,10,104,.5))}}
.cont{display:flex;align-items:center;gap:12px;margin:16px 0 0;padding:14px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none}
.cont:hover{border-color:var(--brand)}.cont .k{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pk-ink);white-space:nowrap}.cont strong{flex:1;font-size:15px;min-width:0}
/* home: seções */
.sec{margin:46px 0 0}.sech{margin-bottom:16px}.sech h2{margin:0 0 4px}.sech p{margin:0;color:var(--muted);font-size:15.5px}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}.cards.s{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.rcard,.scard,.tool{display:flex;flex-direction:column;gap:6px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-decoration:none;transition:border-color .15s,box-shadow .15s,transform .15s}
.rcard:hover,.scard:hover,.tool:hover{border-color:var(--brand);box-shadow:0 10px 26px rgba(0,0,0,.08);transform:translateY(-2px)}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--pk-tint);color:var(--pk-ink);margin-bottom:6px}
.rcard h3,.scard h3,.tool h3{margin:0 0 2px;font-size:17px}.rcard p,.scard p,.tool p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.5}
.mt{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px;font-size:13.5px;font-weight:700;color:var(--pk-ink)}
.scard{flex-direction:row;gap:16px;align-items:flex-start}.scard>div{display:flex;flex-direction:column;flex:1;min-height:100%}
.no{font:800 30px/1 var(--font-display);color:var(--line);letter-spacing:-.02em;min-width:44px}.scard:hover .no{color:var(--brand)}
.tool{flex-direction:row;align-items:flex-start;gap:14px;padding:16px}.tool .ib{margin:0;width:40px;height:40px;flex:none}
.ask{background:#0b0b0b;color:#fff;border-radius:22px;padding:28px 22px;display:grid;gap:22px;margin:46px 0 0}
.ask h2{color:#fff;margin:0 0 6px}.ask p{margin:0;color:#d8cfd3}.ask form{display:grid;gap:10px}
.ask select,.ask textarea{background:#1d1719;border:1px solid #3a3034;color:#fff;border-radius:12px;padding:12px 14px;width:100%;min-height:48px}
.ask .st{min-height:24px;margin:0;font-weight:700;color:var(--accent)}.ask .btn{width:fit-content}
@media(min-width:820px){.ask{grid-template-columns:.8fr 1.2fr;padding:36px 40px;align-items:center}}
.warn{margin:22px 0 0;padding:12px 16px;border-radius:12px;background:var(--warn-bg);border:1px solid var(--warn-line);font-size:14.5px}
/* listas de procedimentos */
.rows{display:grid;gap:10px;margin:18px 0}
.row{display:flex;gap:14px;align-items:center;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:60px}
.row:hover{border-color:var(--brand)}.rn{flex:none;width:34px;height:34px;border-radius:10px;background:var(--pk-tint);color:var(--pk-ink);display:grid;place-items:center;font:800 14px var(--font-display)}
.rt{flex:1;min-width:0}.rt small{display:block;color:var(--muted);line-height:1.4;font-size:13.5px;margin-top:2px}.okm{font-size:12.5px;font-weight:800;color:var(--ok);white-space:nowrap}.row .ic{color:var(--muted)}
.pghead{display:flex;gap:16px;align-items:center;margin-bottom:6px}.pghead .ib{width:52px;height:52px;margin:0;flex:none}.pghead h1{margin:0}
/* blocos de conteúdo */
.blk{margin:18px 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.blk>h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.blk>h3::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--brand)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.step{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:52px}
.step:hover{border-color:var(--brand)}.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bar);color:#fff;display:grid;place-items:center;font:700 14px var(--font-body)}
.step[aria-pressed="true"]{background:var(--pk-tint);border-color:var(--brand)}.step[aria-pressed="true"] .num{background:var(--brand);font-size:0}.step[aria-pressed="true"] .num::after{content:"✓";font-size:15px}
.step[aria-pressed="true"] span:last-child{color:var(--muted)}
.callout{border-left:4px solid #5f6b7a;background:var(--soft)}.callout>h3::before{display:none}
.callout.v-atencao{border-left-color:var(--warn-line);background:var(--warn-bg)}.callout.v-dica{border-left-color:var(--ok);background:var(--ok-tint)}.callout.v-perigo{border-left-color:#c0392b}
.callout.v-info{border-left-color:var(--brand)}
.tag{font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--warn-bg);color:var(--text);border:1px solid var(--warn-line);border-radius:99px;padding:1px 9px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);cursor:pointer;min-height:48px}.opt:hover{border-color:var(--brand)}
.opt.ok{border-color:var(--ok);background:var(--ok-tint)}.opt.no{border-color:var(--brand);background:var(--bad-tint)}.fb{margin:8px 0 0;font-weight:700}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:2px solid var(--line)}td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.two h3{font-size:15px;margin-bottom:6px}.two .y{color:var(--ok)}.two .n{color:var(--pk-ink)}
.chk{display:flex;gap:12px;padding:9px 0;align-items:flex-start;border-bottom:1px solid var(--line)}.chk:last-child{border:0}.chk input{width:22px;height:22px;accent-color:var(--brand);flex:none;margin-top:2px}
.nav{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin:26px 0}
.cm{border-top:1px solid var(--line);padding:12px 0}.cm b{color:var(--pk-ink)}
form.f{display:grid;gap:10px}textarea,select,input[type=search]{-webkit-appearance:none;appearance:none;width:100%;border-radius:12px;border:1px solid var(--line);background:var(--soft);padding:10px 14px;min-height:46px}
dl.gl dt{font-weight:800;color:var(--pk-ink);margin-top:16px}dl.gl dd{margin:2px 0 0}
.srcs a{overflow-wrap:anywhere;font-size:14px;color:var(--pk-ink)}
/* busca */
.ov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(0,0,0,.6);padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 14px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}.ov[hidden]{display:none}
.sbox{max-width:660px;margin:6vh auto 0;background:var(--surface);border-radius:18px;padding:14px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.sbox input{min-height:52px;font-size:17px;-webkit-appearance:none;appearance:none;background:var(--surface)}
.res{list-style:none;margin:10px 0 0;padding:0;max-height:60vh;overflow:auto}.res a{display:block;padding:10px 12px;border-radius:10px;text-decoration:none}.res a:hover{background:var(--soft)}.res small{display:block;color:var(--muted)}
.sit{display:flex;flex-wrap:wrap;gap:8px}.sitb{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:8px 14px;min-height:42px;cursor:pointer;font-weight:600;font-size:14px}.sitb:hover{border-color:var(--brand);color:var(--pk-ink)}
#prog{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;background:var(--brand);width:0;z-index:60}
/* barra inferior (celular) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:22;background:var(--bar);border-top:1px solid rgba(255,255,255,.12);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar a,.tabbar button{flex:1;min-height:58px;background:none;border:0;color:#b9adb3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 11.5px var(--font-body);text-decoration:none;cursor:pointer;padding:6px 2px;position:relative}
.tabbar [aria-current="page"]{color:#fff}.tabbar [aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
/* rodapé */
.foot{background:#0b0b0b;color:#d9d0d4;margin-top:20px;padding:44px 20px 120px}
.foot-in{max-width:1100px;margin:0 auto;display:grid;gap:30px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.foot .fb1{display:flex;align-items:center;gap:12px;color:#fff;font-weight:800;font-size:17px}.foot .fb1 img{width:46px;height:46px}
.foot h4{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:#fff;margin:0 0 10px}
.foot a{display:block;color:#d9d0d4;text-decoration:none;padding:5px 0;font-size:14.5px}.foot a:hover{color:#fff;text-decoration:underline}
.foot p{font-size:13.5px;color:#a89ea3;margin:12px 0 0}.foot-b{max-width:1100px;margin:28px auto 0;border-top:1px solid rgba(255,255,255,.14);padding-top:16px;font-size:13px;color:#a89ea3}
@media(min-width:980px){.foot{padding-bottom:36px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{.top,.side,#prog,form,.nav,.ov,.tabbar,.foot,.scrim,.focob{display:none!important}.shell{display:block}body{background:#fff;color:#000}.blk{break-inside:avoid}}

</style>

<meta name="mobile-web-app-capable" content="yes">

ador, diagnóstico, ação, responsável por função, prazo e resultado."]}, {"tipo": "alerta", "variante": "atencao", "titulo": "Se houver exceção", "texto": "Sem dados suficientes, identificar “não medido” e planejar a coleta antes de estabelecer metas numéricas."}, {"tipo": "alerta", "variante": "info", "titulo": "Validação local (a confirmar com a gestão)", "texto": "Aplicação proposta: confirmar sistema, funções e frequência com a gestão.", "revisar": true}]}, {"id": "ge-04", "categoria": "ge", "codigo": "GE-04", "titulo": "Tratamento de falhas e melhoria contínua", "resumo": "Quando usar: Quando ocorrer erro, reclamação ou retrabalho", "setorTxt": "Gestão / todos os setores", "base": "S4, S1", "tags": ["gestão e qualidade", "ge-04", "tratamento", "falhas", "melhoria", "contínua", "erro", "falha", "retrabalho", "causa", "ocorrencia"], "minutos": 1, "blocos": [{"tipo": "passos", "titulo": "Passo a passo", "itens": [{"texto": "Registre o fato observável, data, setor afetado e impacto sem buscar culpados."}, {"texto": "Corrija primeiro o risco imediato e encaminhe questões técnicas aos profissionais habilitados."}, {"texto": "Investigue causas verificáveis: comunicação, método, treinamento, sistema, material ou capacidade."}, {"texto": "Defina ação de contenção e ação de prevenção, com prazo e responsável por função."}, {"texto": "Após o prazo, verifique evidência do resultado e atualize o guia se houver mudança aprovada."}]}, {"tipo": "texto", "titulo": "Registro / evidência", "paragrafos": ["Registro de ocorrência, causa, ação e verificação."]}, {"tipo": "alerta", "variante": "atencao", "titulo": "Se houver exceção", "texto": "Não tratar relatos como fatos quantificados nem chamar proposta de resultado implantado."}, {"tipo": "alerta", "variante": "info", "titulo": "Validação local (a confirmar com a gestão)", "texto": "Aplicação proposta: confirmar sistema, funções e frequência com a gestão.", "revisar": true}]}, {"id": "ge-05", "categoria": "ge", "codigo": "GE-05", Atender, indicar com responsabilidade, orçar e acompanhar.", "topicos": ["ve-01", "ve-02", "ve-03", "ve-04", "ve-05", "da-02", "da-01"]}, {"id": "recepcao", "nome": "Recepção clínica", "icone": "🩺", "descricao": "Agenda, chegada, exames e reclamações, sem invadir o ato médico.", "topicos": ["cl-01", "cl-02", "cl-03", "cl-04", "da-01", "da-02", "da-03"]}, {"id": "banho-tosa", "nome": "Banho e tosa", "icone": "🛁", "descricao": "Do agendamento à entrega, com segurança e bem-estar.", "topicos": ["bt-01", "bt-02", "bt-03", "da-02"]}, {"id": "creche", "nome": "Creche e permanência", "icone": "🐕", "descricao": "Admissão, supervisão e retirada com o animal sempre protegido.", "topicos": ["cr-01", "cr-02", "bt-02"]}, {"id": "estoque", "nome": "Estoque e compras", "icone": "📦", "descricao": "Receber, conferir validade, organizar e inventariar.", "topicos": ["es-01", "es-02", "es-03", "ve-03"]}, {"id": "gestao", "nome": "Gestão e supervisão", "icone": "📋", "descricao": "Abertura, fechamento, indicadores, melhoria e capacitação.", "topicos": ["ge-01", "ge-02", "ge-03", "ge-04", "ge-05", "es-03", "da-03"]}], "atalhos": [{"texto": "Cliente pede remédio", "q": "remedio"}, {"texto": "Produto vencido ou danificado", "q": "vencido"}, {"texto": "Pet com sinal de doença", "q": "doenca"}, {"texto": "Marcar consulta ou exame", "q": "agendamento"}, {"texto": "Reclamação de cliente", "q": "reclamacao"}, {"texto": "Mensagem no WhatsApp", "q": "whatsapp"}, {"texto": "Produto em falta", "q": "indisponivel"}, {"texto": "Dados do cliente e IA", "q": "dados"}], "faq": [{"pergunta": "Posso dizer a dose de um remédio no balcão?", "resposta": "Não. No balcão não há diagnóstico, posologia nem troca de medicamento. Direcione ao médico-veterinário e siga o fluxo interno aprovado.", "topico": "ve-05"}, {"pergunta": "O tutor ligou contando uma queixa urgente. O que faço?", "resposta": "Encaminhe imediatamente à equipe veterinária, sem avaliar o caso pela recepção, e registre o contato.", "topico": "cl-01"}, {"pergunta": "Posso explicar o resultado de um exame para o tutor?", "resposta": "Não. Encaminhe o resultado para conferência e inclusão no prontuário e avise o próximo passo conforme a comunicação aprovada.", "topico": "cl-03"}, {"pergunta": "Achei um produto vencido ou danificado. E agora?", "resposta": "Separe na hora, impeça o acesso à venda e registre perda, devolução e destinação conforme a regra aplicável.", "topico": "es-02"}, {"pergunta": "O pet se machucou durante o serviço. Quem eu aviso?", "resposta": "Interrompa, proteja o animal e acione imediatamente a equipe veterinária ou o responsável. Registre a intercorrência.", "topico": "bt-03"}, {"pergunta": "Posso mandar promoção para os contatos da base de clientes?", "resposta": "Mensagens promocionais e lembretes precisam respeitar a base legal, a transparência e a preferência ou oposição do titular dos dados.", "topico": "da-02"}, {"pergunta": "Posso colar dados de cliente ou prontuário numa ferramenta de IA?", "resposta": "Não sem autorização e avaliação de proteção de dados. Prontuários identificáveis e dados de clientes não entram em ferramentas de IA por conta própria.", "topico": "da-03"}, {"pergunta": "O saldo do estoque não bate. Posso ajustar no sistema?", "resposta": "Só uma pessoa autorizada, com justificativa. Nunca ajuste saldos silenciosamente nem lance perdas sem rastreabilidade.", "topico": "es-03"}, {"pergunta": "Um tutor quer reclamar de um atendimento clínico.", "resposta": "Ouça, registre data, canal e situação, não prometa diagnóstico nem compensação e, se houver risco ao animal, encaminhe na hora ao responsável técnico.", "topico": "cl-04"}, {"pergunta": "O cliente recusou o orçamento. Insisto?", "resposta": "Encerre com cordialidade. Não faça contatos adicionais sem base apropriada.", "topico": "ve-03"}], "glossario": [{"termo": "Tutor", "definicao": "Pessoa responsável pelo pet. É o termo usado no guia para o cliente que traz o animal."}, {"termo": "RT (responsável técnico)", "definicao": "Profissional habilitado que valida protocolos clínicos, sanitários e técnicos e responde pelas decisões técnicas do estabelecimento."}, {"termo": "PVPS / FEFO", "definicao": "Regras de organização do estoque: primeiro que vence, primeiro que sai. Os lotes com vencimento mais próximo ficam na frente."}, {"termo": "Lote", "definicao": "Identificação de um grupo de produtos fabricados juntos. É conferido, junto com a validade, na entrada da mercadoria."}, {"termo": "Ruptura de estoque", "definicao": "Quando um item monitorado está indisponível. O indicador mede quantos itens monitorados faltam."}, {"termo": "Ticket médio", "definicao": "Vendas líquidas do período divididas pelo número de vendas."}, {"termo": "Prontuário", "definicao": "Registro clínico do paciente. Só profissionais habilitados o interpretam; a recepção cuida apenas do fluxo administrativo."}, {"termo": "Titular (de dados)", "definicao": "A pessoa a quem os dados pessoais se referem, como o tutor cadastrado. Tem direito a atualizar e a se opor a contatos."}, {"termo": "Base legal", "definicao": "O fundamento que permite usar um dado pessoal para determinada finalidade, conforme a lei de proteção de dados."}, {"termo": "PGRSS", "definicao": "Plano de Gerenciamento de Resíduos de Serviços de Saúde. O guia pede que a situação seja verificada por unidade e atividade."}, {"termo": "SimplesVet e Peti9", "definicao": "Ferramentas digitais citadas no guia. Permissões e usos devem seguir o que a gestão confirmar; não se presume integração entre elas."}, {"termo": "POP", "definicao": "Procedimento Operacional Padrão. Este guia ainda não é um POP oficial: precisa de validação da gestão e do RT."}], "abas": [{"id": "sondagem", "icone": "🎯", "titulo": "Sondagem do cliente", "resumo": "Descubra a dor do cliente antes de indicar qualquer produto.", "intro": "Antes de indicar um produto ou medicamento, descubra a dor do cliente. Em poucos minutos você entende o caso, protege o pet e abre portas para um atendimento mais completo.", "blocos": [{"tipo": "texto", "titulo": "O que é a sondagem do cliente?", "paragrafos": ["**Identificar a dor do cliente e sanar a dor do cliente.**", "É a etapa logo depois do acolhimento e antes de apresentar o produto: você pergunta, escuta e só então indica a solução. Quem chega pedindo um item específico ou um medicamento quase sempre tem uma história por trás, e é ela que mostra o que realmente ajuda."]}, {"tipo": "tabela", "titulo": "As perguntas-chave", "colunas": ["Pergunta", "O que você descobre", "Como usar"], "linhas": [["O que é que seu pet tem?", "O motivo real da procura: a dor do tutor e do pet.", "Escute sem interromper e sem diagnosticar."], ["Como é que ele está?", "O estado geral do animal.", "Sinal de sofrimento ou mudança de comportamento: chame o veterinário."], ["Há quanto tempo ele está assim?", "Duração e urgência.", "Quadro que se arrasta ou piora: encaminhe ao veterinário."], ["Ele está com febre?", "Sinal de alerta clínico.", "Se sim ou se houver dúvida: encaminhe ao veterinário."], ["Ele está com dor?", "Sinal de alerta clínico.", "Se sim ou se houver dúvida: encaminhe ao veterinário."]]}, {"tipo": "alerta", "variante": "atencao", "titulo": "O limite que não muda", "texto": "Sondar serve para entender a necessidade e escolher o caminho, não para tratar. Pelo guia (VE-01 e VE-05), o balcão **não faz diagnóstico, não indica dose e não troca medicação**. Com sinais de doença, dor ou dúvida terapêutica, o caminho é o médico-veterinário.", "link": {"href": "#ve-05", "texto": "Ver VE-05: venda responsável de produtos veterinários →"}}, {"tipo": "passos", "titulo": "Roteiro da sondagem em 6 passos", "itens": [{"texto": "**Acolha** sem pressa e sem interromper quem prefere olhar os produtos."}, {"texto": "**Pergunte abrindo a conversa:** use as cinco perguntas-chave, uma de cada vez, em tom de cuidado e não de interrogatório."}, {"texto": "**Escute até o fim.** Anote espécie, porte, idade e o que o tutor contou."}, {"texto": "**Resuma antes de indicar:** “Entendi, você busca [necessidade]. Vou conferir as opções e os preços.”"}, {"texto": "**Escolha o caminho:** sinais de doença, dor ou febre levam ao veterinário. Sem sinais, apresente uma ou duas opções com preço visível."}, {"texto": "**Registre** o desfecho no sistema autorizado: compra, orçamento ou encaminhamento."}]}, {"tipo": "texto", "titulo": "Como a sondagem abre o leque de oportunidades", "paragrafos": ["Quando você entende a dor, enxerga o que mais ajuda o pet além do item que o tutor pediu. É assim que nascem as vendas maiores: **cuidado completo, não empurrão.**", "Fala de apoio do próprio guia (VE-02): “Se for útil, também temos [item relacionado]; posso mostrar, sem compromisso.”"]}, {"tipo": "faca_naofaca", "fazer": ["Ofereça itens relacionados à necessidade que o tutor contou, com preço visível.", "Explique só o que o rótulo ou o fabricante comprovam.", "Deixe o tutor decidir e aceite o “não” com simpatia.", "Peça avaliação espontânea só depois de resolver tudo."], "naoFazer": ["Prometer cura ou resultado.", "Usar benefícios não comprovados.", "Induzir compra por pressão ou condicionar benefícios.", "Indicar dose, trocar medicação ou dar palpite clínico."]}, {"tipo": "cenario", "titulo": "Pratique 1", "situacao": "Um tutor chega pedindo “um remédio para coceira” para o cachorro.", "escolhas": [{"texto": "Entregar o produto mais vendido e explicar como usar.", "resultado": "Sem sondagem você não sabe a causa, e orientar o uso é conduta terapêutica.", "ideal": false}, {"texto": "Perguntar o que o pet tem, como está e há quanto tempo, escutar e, havendo sinais de doença ou dor, encaminhar ao veterinário.", "resultado": "Isso mesmo: a sondagem mostra se é caso de veterinário. A venda só segue conferindo rotulagem e exigências do produto (VE-05).", "ideal": true}, {"texto": "Dizer que é alergia e vender um antialérgico.", "resultado": "Diagnóstico e medicação no balcão não são permitidos.", "ideal": false}]}, {"tipo": "cenario", "titulo": "Pratique 2", "situacao": "Uma tutora quer a ração que sempre leva, mas ela acabou. Ela comenta que adotou um filhote há uma semana.", "escolhas": [{"texto": "Dizer que acabou e deixá-la ir embora.", "resultado": "Chance perdida de ajudar. Consulte estoque e reposição confirmada e sugira alternativa equivalente (VE-03).", "ideal": false}, {"texto": "Perguntar idade, porte e rotina, consultar o estoque das unidades e, havendo equivalente apropriado, mostrar uma ou duas opções com preço.", "resultado": "Isso mesmo: a sondagem muda a recomendação e mantém a venda, sem prometer o que não está confirmado.", "ideal": true}, {"texto": "Garantir que a ração chega amanhã, sem confirmar.", "resultado": "Não prometa prazo sem confirmação (VE-03).", "ideal": false}]}, {"tipo": "checklist", "id": "ck-sondagem", "titulo": "Checklist da sondagem", "itens": ["Acolhi sem interromper?", "Perguntei o que o pet tem, como está e há quanto tempo?", "Perguntei sobre febre e dor?", "Escutei até o fim e resumi o que entendi?", "Sinal de doença ou dúvida terapêutica: encaminhei ao veterinário?", "Apresentei uma ou duas opções com preço visível?", "Ofereci item relacionado, sem pressão?", "Registrei o desfecho?"]}, {"tipo": "alerta", "variante": "info", "titulo": "Validação local (a confirmar com a gestão)", "texto": "Conteúdo pedido pela gestão e complementado com pesquisa pública. Como todo roteiro de atendimento deste guia, precisa ser aprovado pela gestão e pelo responsável técnico antes de valer como norma.", "revisar": true}]}]}, LOGO = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAYAAAD0eNT6AAEAAElEQVR4Xuz9Z3ckWZYtiG3T5lrCoUNnZmWW5nv9OORwuNZ8If/xfOficN4j+01PidShoQHX0rQZ1z7XzOFARGRkdlV1d1X6zfICAnC4MDO/55x99tlbyzwN2/X3v1Itu/smsrvnVZd/65Cf865pfoszZHGKLMmQ8vsk/3l+nyyTv4IBYHulbNd2bdd2/eMs7u3btV3btV3btV3b9TNb5s/s/W4XF0t5uWXINm63P4dCCYgZ5GV/gS/cBxq2a7u2a7u26+9zbRGAn+sqkgBeAZu34uf31r0Gw3Zt13Zt13b9na8tAvB3stJ7uZouTfzbpd+L0GtOQM4FSPNKXpdQnud9mgZoKTT5SjRAIQMFXUBWu const $ = (s, r = document) => r.querySelector(s);
const h = (t, a = {}, ...k) => { const e = document.createElement(t); for (const [n, v] of Object.entries(a || {})) { if (v == null || v === false) continue; if (n === "class") e.className = v; else if (n.startsWith("on")) e.addEventListener(n.slice(2), v); else e.setAttribute(n, v === true ? "" : v); } k.flat(9).forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); }); return e; };
const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const inline = t => String(t).split(/(\*\*[^*]+\*\*)/).filter(Boolean).map(p => /^\*\*.+\*\*$/.test(p) ? h("strong", {}, p.slice(2, -2)) : p);

/* ---------- Armazenamento (por pessoa) e comentários ---------- */
class LocalAdapter { constructor(ns) { this.ns = ns; this.mem = {}; }
  async get(k, d = null) { try { const v = localStorage.getItem(this.ns + k); return v == null ? d : JSON.parse(v); } catch { return k in this.mem ? this.mem[k] : d; } }
  async set(k, v) { this.mem[k] = v; try { localStorage.setItem(this.ns + k, JSON.stringify(v)); } catch { } return v; } }
class LocalComments { /* só neste aparelho */
  constructor(store) { this.s = store; this.w = new Set(); this.uid = "local"; }
  all() { return this.s.get("comments", []); }
  async add(c) { const a = await this.all(); a.push({ ...c, id: Date.now().toString(36), uid: "local", criadoEm: Date.now() }); await this.s.set("comments", a); this.w.forEach(f => f()); }
  async remove(id) { await this.s.set("comments", (await this.all()).filter(c => c.id !== id)); this.w.forEach(f => f()); }
  watch(topico, cb) { const f = async () => cb((await this.all()).filter(c => !topico || c.topico === topico)); this.w.add(f); f(); return () => this.w.delete(f); } }
class SharedComments { /* capacidade "db": compartilhado com a equipe; um documento por comentário */
  constructor(db, uid) { this.db = db; this.uid = uid; }
